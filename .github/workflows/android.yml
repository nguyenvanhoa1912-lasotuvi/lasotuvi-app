# Build Android trên máy chủ GitHub (không cần cài Android Studio trên máy cá nhân)
# - Mỗi lần push lên main: build APK thử nghiệm (debug, quảng cáo test) để cài lên điện thoại.
# - Chạy tay "Run workflow" với release = true: build AAB đã ký để upload Google Play.
name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']          # đẩy tag v1.0.x -> tự build AAB phát hành
  workflow_dispatch:
    inputs:
      release:
        description: 'Build bản phát hành (AAB đã ký, quảng cáo THẬT)'
        type: boolean
        default: false
      pull_latest_web:
        description: 'Lấy index/SaoTuVi/KinhDich mới nhất từ repo lasotuvi'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEB_REPO: nguyenvanhoa1912-lasotuvi/lasotuvi
      IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v') }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Lấy bản HTML mới nhất từ repo web
        if: github.event_name == 'push' || inputs.pull_latest_web
        run: |
          git clone --depth 1 "https://github.com/${WEB_REPO}.git" /tmp/webrepo
          cp /tmp/webrepo/index.html /tmp/webrepo/SaoTuVi.html /tmp/webrepo/KinhDich.html web/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Máy build ubuntu-latest đã cài sẵn Android SDK (biến ANDROID_HOME)
      - name: Kiểm tra Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Không tìm thấy Android SDK"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cài thư viện
        run: npm ci

      # Bản phát hành: dùng ID AdMob thật khi đủ cả 3 secrets; thiếu bất kỳ cái nào -> dùng QC thử nghiệm
      # (cho phép bắt đầu kiểm thử kín trên Google Play trước khi có tài khoản AdMob)
      - name: Chọn ID quảng cáo
        if: env.IS_RELEASE == 'true'
        env:
          S_APP: ${{ secrets.ADMOB_APP_ID }}
          S_BANNER: ${{ secrets.ADMOB_BANNER_ID }}
          S_REWARDED: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          if [ -n "$S_APP" ] && [ -n "$S_BANNER" ] && [ -n "$S_REWARDED" ]; then
            { echo "ADMOB_APP_ID=$S_APP"; echo "ADMOB_BANNER_ID=$S_BANNER"; echo "ADMOB_REWARDED_ID=$S_REWARDED"; } >> "$GITHUB_ENV"
            echo "::notice::Bản phát hành dùng ID AdMob THẬT"
          else
            echo "::warning::Chưa đủ 3 secrets ADMOB_* -> bản này dùng QUẢNG CÁO THỬ NGHIỆM (không có doanh thu). Chỉ dùng cho kiểm thử kín."
          fi

      - name: Đóng gói web + đồng bộ Android
        run: npm run sync

      - name: Build APK thử nghiệm (debug)
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Giải mã keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB phát hành (đã ký)
        if: env.IS_RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Thiếu secret ký app (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)"; exit 1
          fi
          ./gradlew bundleRelease --no-daemon

      - name: Tải lên APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LaSoTuVi-debug-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Tải lên AAB
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LaSoTuVi-release-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/*.aab
